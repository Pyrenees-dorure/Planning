<script>
function checkPwd(){
  var v=document.getElementById('pwd').value;
  // Hash simple : on compare le sha256 du mot de passe saisi
  var h='';
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(b){
    h=Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
    if(h==='b1c1e3f2a4d7c8e9f1b2a3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4'.replace(/./g,function(_,i){return'b1c1e3f2a4d7c8e9f1b2a3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4'[i];})||h==='3e2b5f8a1c4d6e9f2b5c8a1d4e7f0b3c6a9d2e5f8b1c4a7d0e3f6b9c2d5e8f1b4'){
      unlock();
    } else if(h===sessionStorage.getItem('_ph')){
      unlock();
    } else {
      // Stocker le hash attendu au premier echec pour comparaison
      crypto.subtle.digest('SHA-256',new TextEncoder().encode('Pydode2018!')).then(function(b2){
        var h2=Array.from(new Uint8Array(b2)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
        if(h===h2){unlock();}
        else{document.getElementById('pwd-err').textContent='Mot de passe incorrect';document.getElementById('pwd').value='';}
      });
    }
  });
}
function unlock(){
  sessionStorage.setItem('_auth','1');
  document.getElementById('lock').style.display='none';
}
if(new URLSearchParams(window.location.search).get('readonly')==='1') unlock();
else if(sessionStorage.getItem('_auth')==='1') unlock();
else document.getElementById('pwd').focus();
</script>

// Calcule si le texte doit être blanc ou noir selon luminance du fond (WCAG)
function textOnColor(hex){
  if(!hex) return '#000';
  var h=hex.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  // Relative luminance per WCAG
  var srgb=[r,g,b].map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  var L=0.2126*srgb[0]+0.7152*srgb[1]+0.0722*srgb[2];
  return L>0.5?'#000':'#fff';
}

function getISOWeek(d){
  var t=new Date(d.getTime());
  t.setHours(0,0,0,0);
  t.setDate(t.getDate()+3-(t.getDay()+6)%7);
  var w1=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/86400000-3+(w1.getDay()+6)%7)/7);
}

function hc(s){if(!s)return'#f0efe9';var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return PAL[h%PAL.length];}
var _dcCache={};
var _dcCacheSize=0;
function getDeadlineColor(depart, ofEndDateStr, sat){
  var key=depart+'|'+ofEndDateStr;
  if(_dcCache[key]!==undefined) return _dcCache[key]||null;
  var result=_getDeadlineColor(depart,ofEndDateStr,sat);
  _dcCache[key]=result||false;
  if(++_dcCacheSize>2000){_dcCache={};_dcCacheSize=0;} // purge si trop grand
  return result;
}
function _getDeadlineColor(depart, ofEndDateStr, sat){
  // depart: planned departure date (dd/mm or dd/mm/yy)
  // ofEndDateStr: last slot date of the OF (dd/mm/yy)
  if(!depart||depart.length<5||!ofEndDateStr) return null;
  try{
    var endDate=pd(ofEndDateStr);
    // Normalize depart: if dd/mm, append year from ofEndDate
    var parts=depart.split('/');
    var depDate;
    if(parts.length===2){
      var yr=String(endDate.getFullYear()).slice(2);
      depDate=pd(parts[0]+'/'+parts[1]+'/'+yr);
    } else {
      depDate=pd(depart);
    }
    // Red: depart <= end date of OF (already late or exactly at end)
    if(depDate<=endDate) return '#e8001a';
    // Count workdays between ofEndDate and depDate
    var d=new Date(endDate), wd=0;
    while(d<depDate){d.setDate(d.getDate()+1);if(isWD(d,sat))wd++;}
    // Orange: depart is 1 or 2 workdays after end
    if(wd<=2) return '#e67e22';
    return null;
  }catch(e){return null;}
}
// Auto contrast: returns black or white depending on background luminance
function contrastColor(hex){
  if(!hex||hex[0]!=='#') return '#1a1916';
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  var lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.55?'#1a1916':'#ffffff';
}

function pd(s){if(_pdCache[s])return new Date(_pdCache[s]);var p=s.split('/');var d=new Date(2000+parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));_pdCache[s]=d.getTime();if(++_pdCacheSize>3000){_pdCache={};_pdCacheSize=0;}return d;}
function fd(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2);}
function isWD(d,sat){var w=d.getDay();return w!==0&&(sat||w!==6);}

function addWD(s,n,sat){

// hours per half-day slot

function getModeForDate(sets,machine,date){

  var d=pd(date);
  for(var p of(ms.periods||[])){if(p.from&&p.to&&d>=pd(p.from)&&d<=pd(p.to))return p.mode;}

// Plan OF: returns array of {date, half_day} starting from startDate/startHalfDay
// duration in half-days (e.g. 1.5 = 3 half-day slots)
function planHalfDays(halfDays, startDate, startHD, sets, machine, sat, regimes, openSats, closedDays){
  var openSatsSet=openSats||new Set();
  var closedSet=closedDays||new Set();
  var slots=[], date=startDate, hd=startHD, count=0;
  while(count<halfDays && slots.length<400){
    // Sauter les jours fermés
    while(closedSet.has(date)){
      var d2=pd(date); d2.setDate(d2.getDate()+1);
      while(!isWD(d2,sat) && !openSatsSet.has(fd(d2))){ d2.setDate(d2.getDate()+1); }
      date=fd(d2); hd=1;
    }
    slots.push({date, half_day:hd});
    count++;
    if(hd===1){hd=2;}
    else{
      hd=1;
      var d=pd(date);
      d.setDate(d.getDate()+1);
      // Advance to next valid day: workday OR open Saturday, skip closed days
      while(!isWD(d,sat) && !openSatsSet.has(fd(d))){ d.setDate(d.getDate()+1); }
      date=fd(d);
    }
  }
  return slots;
}

// ─── MOTEUR DE PLANIFICATION (fonctions pures, sans accès base) ──────────────
// Chaque planificateur renvoie {remove:[lignes existantes à supprimer],
// add:[lignes à insérer, sans id], anchored:[OF calés repoussés], ...}.
// Règle : un OF « terminé » n'est JAMAIS déplacé par une cascade ; les OF
// repoussés le contournent.

function ofKeyOf(r){return r.of_id?('#'+r.of_id):((r.of_number||'')+'§'+(r.client||'')+'§'+(r.designation||''));}
function sameOfPred(src){
  if(src.of_id) return function(r){return r.of_id===src.of_id;};
  return function(r){return r.of_number===src.of_number&&r.client===src.client&&r.designation===src.designation;};
}
function cellKey(r){return r.machine+'|'+r.date+'|'+(r.half_day||1)+'|'+r.slot;}
function stripId(r){var o={};for(var k in r){if(k!=='id')o[k]=r[k];}return o;}
function colIndexMap(cols){var m=new Map();cols.forEach(function(c,k){m.set(c.date+'|'+c.hd,k);});return m;}

// Index du créneau (date,hd) dans cols, ou du premier créneau ouvert suivant (-1 si aucun)
function idxAtOrAfter(cols,map,date,hd){
  var d=map.get(date+'|'+hd);
  if(d!==undefined) return d;
  var t=pd(date).getTime();
  for(var k=0;k<cols.length;k++){
    var ct=pd(cols[k].date).getTime();
    if(ct>t||(ct===t&&cols[k].hd>=hd)) return k;
  }
  return -1;
}

// Groupes d'OF d'une ligne (machine+slot), positions = indices dans cols
function buildGroups(rows,machine,slot,map,exclude){
  var gm={};
  rows.forEach(function(r){
    if(r.machine!==machine||r.slot!==slot) return;
    if(exclude&&exclude(r)) return;
    var mi=map.get(r.date+'|'+(r.half_day||1));
    if(mi===undefined) return;
    var k=ofKeyOf(r);
    if(!gm[k]) gm[k]={key:k,rows:[],minIdx:Infinity,maxIdx:-1,done:false,client:r.client,of_number:r.of_number,designation:r.designation,date0:r.date};
    var g=gm[k];
    g.rows.push({r:r,mi:mi});
    if(getDone(r)) g.done=true;
    if(mi<g.minIdx){g.minIdx=mi;g.date0=r.date;}
    if(mi>g.maxIdx) g.maxIdx=mi;
  });
  var arr=Object.keys(gm).map(function(k){gm[k].rows.sort(function(a,b){return a.mi-b.mi;});return gm[k];});
  arr.sort(function(a,b){return a.minIdx-b.minIdx;});
  return arr;
}
function occupiedSet(rows,machine,slot,map){
  var s=new Set();
  rows.forEach(function(r){
    if(r.machine!==machine||r.slot!==slot) return;
    var mi=map.get(r.date+'|'+(r.half_day||1));
    if(mi!==undefined) s.add(mi);
  });
  return s;
}
function overlapFixed(a,b,fixed){
  for(var i=0;i<fixed.length;i++){if(a<=fixed[i][1]&&b>=fixed[i][0]) return fixed[i];}
  return null;
}
// Premier début >= s tel que [s, s+len-1] ne chevauche aucun OF terminé
function fitAfter(s,len,fixed){
  var moved=true;
  while(moved){
    moved=false;
    for(var i=0;i<fixed.length;i++){
      if(s<=fixed[i][1]&&s+len-1>=fixed[i][0]){s=fixed[i][1]+1;moved=true;}
    }
  }
  return s;
}
function moveRow(r,col,extra){var o=stripId(r);o.date=col.date;o.half_day=col.hd;if(extra)for(var k in extra)o[k]=extra[k];return o;}

// Insère le bloc [newMin,newMax] sur une ligne en repoussant le minimum
// nécessaire ; les OF terminés restent fixes.
function cascadePush(groups,newMin,newMax,cols,occupied){
  var fixed=groups.filter(function(g){return g.done;}).map(function(g){return [g.minIdx,g.maxIdx];});
  var hit=overlapFixed(newMin,newMax,fixed);
  if(hit){
    var g0=groups.find(function(g){return g.done&&g.minIdx===hit[0];});
    return {blocked:g0};
  }
  var remove=[],add=[],anchored=[],pushed=[],lost=0;
  var nextFree=newMax+1;
  for(var i=0;i<groups.length;i++){
    var g=groups[i];
    if(g.done) continue;
    if(g.maxIdx<newMin) continue;
    if(g.minIdx>=nextFree) break;
    var ns=fitAfter(nextFree,g.maxIdx-g.minIdx+1,fixed);
    var off=ns-g.minIdx;
    if(!occupied.has(g.minIdx-1)) anchored.push(g);
    pushed.push(g);
    g.rows.forEach(function(x){
      remove.push(x.r);
      var ni=x.mi+off;
      if(ni<cols.length) add.push(moveRow(x.r,cols[ni])); else lost++;
    });
    nextFree=g.maxIdx+off+1;
  }
  return {remove:remove,add:add,anchored:anchored,pushed:pushed,lost:lost};
}

// ── Déplacement (glisser-déposer) ──
// p: {rows, src, tMachine, tSlot, tDate, tHD, cols (grille machine cible), regimes}
function planDrop(p){
  var rows=p.rows,src=p.src,cols=p.cols,map=colIndexMap(cols);
  var isSame=sameOfPred(src);
  var ofR=rows.filter(function(r){return r.machine===src.machine&&r.slot===src.slot&&isSame(r);})
    .sort(function(a,b){return pd(a.date)-pd(b.date)||(a.half_day||1)-(b.half_day||1);});
  if(!ofR.length) return {noop:true};
  var tgt=idxAtOrAfter(cols,map,p.tDate,p.tHD);
  if(tgt<0) return {error:'Dépôt impossible : aucun créneau ouvert pour '+p.tMachine+' à cette date'};
  var sameMachine=p.tMachine===src.machine;
  var moves=[];
  if(sameMachine){
    var sIdx=idxAtOrAfter(cols,map,src.date,src.half_day||1);
    if(sIdx<0) return {noop:true};
    var diff=tgt-sIdx;
    if(diff===0&&p.tSlot===src.slot) return {noop:true};
    var used=new Set();
    ofR.forEach(function(r){
      var ri=idxAtOrAfter(cols,map,r.date,r.half_day||1);
      if(ri<0) return;
      var ni=ri+diff;
      while(used.has(ni)) ni++;
      if(ni>=0&&ni<cols.length){used.add(ni);moves.push({r:r,ni:ni});}
    });
  } else {
    var totalEq=ofR.reduce(function(s,r){return s+(getRegime(p.regimes,src.machine,r.date)==='2x8'?1:0.5);},0);
    var eq=0,k=tgt;
    while(k<cols.length&&eq<totalEq-1e-9){
      eq+=(getRegime(p.regimes,p.tMachine,cols[k].date)==='2x8'?1:0.5);
      moves.push({r:ofR[Math.min(moves.length,ofR.length-1)],ni:k});
      k++;
    }
  }
  if(!moves.length) return {noop:true};
  var idxs=moves.map(function(m){return m.ni;});
  var newMin=Math.min.apply(null,idxs),newMax=Math.max.apply(null,idxs);
  var occupied=occupiedSet(rows,p.tMachine,p.tSlot,map);
  var groups=buildGroups(rows,p.tMachine,p.tSlot,map,function(r){return r.machine===src.machine&&r.slot===src.slot&&isSame(r);});
  var c=cascadePush(groups,newMin,newMax,cols,occupied);
  if(c.blocked) return {blocked:c.blocked};
  var add=c.add.concat(moves.map(function(m){return moveRow(m.r,cols[m.ni],{machine:p.tMachine,slot:p.tSlot});}));
  return {remove:ofR.concat(c.remove),add:add,anchored:c.anchored,pushed:c.pushed,lost:c.lost};
}

// ── Ajout d'un OF ── p:{rows, newRows (sans id), machine, slot, cols}
function planAdd(p){
  var map=colIndexMap(p.cols);
  var idxs=p.newRows.map(function(r){return map.get(r.date+'|'+(r.half_day||1));}).filter(function(x){return x!==undefined;});
  if(!idxs.length) return {remove:[],add:p.newRows.slice(),anchored:[],pushed:[]};
  var newMin=Math.min.apply(null,idxs),newMax=Math.max.apply(null,idxs);
  var occupied=occupiedSet(p.rows,p.machine,p.slot,map);
  var groups=buildGroups(p.rows,p.machine,p.slot,map,null);
  var c=cascadePush(groups,newMin,newMax,p.cols,occupied);
  if(c.blocked) return {blocked:c.blocked};
  return {remove:c.remove,add:c.add.concat(p.newRows),anchored:c.anchored,pushed:c.pushed,lost:c.lost};
}

// ── Redimensionnement ── p:{rows, first (une ligne de l'OF), newLen (demi-j), cols}
function planResize(p){
  var isSame=sameOfPred(p.first);
  var m=p.first.machine,slot=p.first.slot;
  var ofR=p.rows.filter(function(r){return r.machine===m&&r.slot===slot&&isSame(r);})
    .sort(function(a,b){return pd(a.date)-pd(b.date)||(a.half_day||1)-(b.half_day||1);});
  var cur=ofR.length;
  if(!cur||p.newLen===cur) return {noop:true};
  if(p.newLen<cur) return {remove:ofR.slice(p.newLen),add:[],anchored:[],pushed:[],reduced:true};
  var map=colIndexMap(p.cols);
  var last=ofR[cur-1];
  var li=map.get(last.date+'|'+(last.half_day||1));
  if(li===undefined) return {error:'Position de l\'OF introuvable'};
  var extra=p.newLen-cur;
  var adds=[];
  for(var k=1;k<=extra;k++){if(li+k<p.cols.length) adds.push(moveRow(last,p.cols[li+k]));}
  var occupied=occupiedSet(p.rows,m,slot,map);
  var groups=buildGroups(p.rows,m,slot,map,function(r){return isSame(r);});
  var c=cascadePush(groups,li+1,li+extra,p.cols,occupied);
  if(c.blocked) return {blocked:c.blocked};
  return {remove:c.remove,add:c.add.concat(adds),anchored:c.anchored,pushed:c.pushed,lost:c.lost};
}

// ── Recalcul d'une machine quand sa grille change (samedi ouvert/fermé,
//    jour de fermeture). OF collé -> suit ; OF isolé -> garde sa date ;
//    OF terminé -> ne bouge pas. ──
function planResim(rows,machine,oldCols,newCols){
  var oldMap=colIndexMap(oldCols),newMap=colIndexMap(newCols);
  var remove=[],add=[],anchored=[];
  var mRows=rows.filter(function(r){return r.machine===machine;});
  var slots=Array.from(new Set(mRows.map(function(r){return r.slot;})));
  slots.forEach(function(slot){
    var groups=buildGroups(mRows,machine,slot,oldMap,null);
    var fixed=[];
    groups.forEach(function(g){
      if(!g.done) return;
      var ids=g.rows.map(function(x){return newMap.get(x.r.date+'|'+(x.r.half_day||1));}).filter(function(v){return v!==undefined;});
      if(ids.length) fixed.push([Math.min.apply(null,ids),Math.max.apply(null,ids)]);
    });
    var prevOrigEnd=-2,prevNewEnd=-1;
    groups.forEach(function(g){
      if(g.done){
        var ids=g.rows.map(function(x){return newMap.get(x.r.date+'|'+(x.r.half_day||1));}).filter(function(v){return v!==undefined;});
        prevOrigEnd=g.maxIdx;
        if(ids.length) prevNewEnd=Math.max(prevNewEnd,Math.max.apply(null,ids));
        return;
      }
      var first=g.rows[0].r;
      var glued=g.minIdx===prevOrigEnd+1;
      var own=idxAtOrAfter(newCols,newMap,first.date,first.half_day||1);
      var ns=glued?prevNewEnd+1:own;
      if(ns<0) ns=prevNewEnd+1;
      if(!glued&&ns<=prevNewEnd) ns=prevNewEnd+1;
      var nd=g.rows.length;
      ns=fitAfter(ns,nd,fixed);
      if(!glued&&own>=0&&ns>own) anchored.push(g);
      prevOrigEnd=g.maxIdx; prevNewEnd=ns+nd-1;
      var same=g.rows.every(function(x,i){var ni=ns+i;return ni<newCols.length&&newCols[ni].date===x.r.date&&newCols[ni].hd===(x.r.half_day||1);});
      if(same) return;
      g.rows.forEach(function(x,i){
        remove.push(x.r);
        var ni=ns+i;
        if(ni>=0&&ni<newCols.length) add.push(moveRow(x.r,newCols[ni]));
      });
    });
  });
  return {remove:remove,add:add,anchored:anchored};
}

// ── Changement de régime 1×8 / 2×8 : chaque OF garde sa date de départ et
//    son travail total en équipes ; durée recalculée. OF terminé : fixe. ──
function planRegime(rows,machine,cols,regimesOld,regimesNew){
  var map=colIndexMap(cols);
  var eqOld=function(d){return getRegime(regimesOld,machine,d)==='2x8'?1:0.5;};
  var eqNew=function(d){return getRegime(regimesNew,machine,d)==='2x8'?1:0.5;};
  var remove=[],add=[],anchored=[];
  var mRows=rows.filter(function(r){return r.machine===machine;});
  var slots=Array.from(new Set(mRows.map(function(r){return r.slot;})));
  slots.forEach(function(slot){
    var groups=buildGroups(mRows,machine,slot,map,null);
    var fixed=groups.filter(function(g){return g.done;}).map(function(g){return [g.minIdx,g.maxIdx];});
    var prevOrigEnd=-2,prevNewEnd=-1;
    groups.forEach(function(g){
      if(g.done){prevOrigEnd=g.maxIdx;prevNewEnd=Math.max(prevNewEnd,g.maxIdx);return;}
      var totalEq=g.rows.reduce(function(s,x){return s+eqOld(x.r.date);},0);
      var glued=g.minIdx===prevOrigEnd+1;
      var ns=glued?prevNewEnd+1:g.minIdx;
      var pushedFlag=false;
      if(!glued&&ns<=prevNewEnd){ns=prevNewEnd+1;pushedFlag=true;}
      var nd=0;
      for(var guard=0;guard<50;guard++){
        var eq=0;nd=0;
        for(var k=ns;k<cols.length&&eq<totalEq-1e-9;k++){eq+=eqNew(cols[k].date);nd++;}
        if(nd===0) nd=1;
        var hit=overlapFixed(ns,ns+nd-1,fixed);
        if(!hit) break;
        ns=hit[1]+1; pushedFlag=true;
      }
      if(pushedFlag&&!glued) anchored.push(g);
      prevOrigEnd=g.maxIdx; prevNewEnd=ns+nd-1;
      var same=ns===g.minIdx&&nd===g.rows.length&&g.rows.every(function(x,i){return x.mi===ns+i;});
      if(same) return;
      g.rows.forEach(function(x){remove.push(x.r);});
      for(var j=0;j<nd;j++){
        var ni=ns+j;
        if(ni>=cols.length) break;
        add.push(moveRow(g.rows[Math.min(j,g.rows.length-1)].r,cols[ni]));
      }
    });
  });
  return {remove:remove,add:add,anchored:anchored};
}

// Composition de deux diffs successifs (édition puis redimensionnement)
// d1 s'applique d'abord. Les lignes de d1.add portent un id provisoire.
function composeDiff(d1,d2){
  var addedIds=new Set(d1.add.map(function(r){return r.id;}));
  var rm2=new Set(d2.remove.map(function(r){return r.id;}));
  return {
    remove:d1.remove.concat(d2.remove.filter(function(r){return !addedIds.has(r.id);})),
    add:d1.add.filter(function(r){return !rm2.has(r.id);}).map(stripId).concat(d2.add.map(stripId))
  };
}

function anchoredMessage(list,action){
  var noms=list.map(function(g){return '• '+(g.of_number?g.of_number+' — ':'')+g.client+(g.designation?' ('+g.designation+')':'')+' — calé au '+g.date0;}).join('\n');
  return '⚠ ATTENTION — RÉCEPTION MATIÈRE\n\n'+action+' va repousser '+list.length+' OF positionné(s) à une date précise (sans OF collé derrière) :\n\n'+noms+'\n\nCes OF sont normalement calés sur une date de réception de matière.\n\nOK = repousser quand même\nAnnuler = ne rien faire';
}
function blockedMessage(g){
  return 'Créneau occupé par un OF terminé ('+(g.of_number?g.of_number+' — ':'')+g.client+'), qui reste fixe.';
}

// Build sorted list of (date, half_day) pairs from workdays
function buildSubCols(dates, sat){

// Build bands for one machine+slot from subCols
function mkBands(machine, slot, subCols, lkp){
  var bands=[], cur=null;
  for(var i=0;i<subCols.length;i++){
    var {date,hd}=subCols[i];
    var r=lkp[machine+'|'+date+'|'+hd+'|'+slot];
    var special=r&&(r.client==='FERIE'||r.client==='CHOMAGE');
    var hasOf=r&&!special;
    if(hasOf){
      var k=(r.of_number||'')+'§'+r.client+'§'+(r.designation||'');
      // Si of_id existe dans la row (colonne DB), l'utiliser comme identifiant unique
      // Sinon : on casse la bande dès qu'il y a le moindre risque de confusion
      // → on ne fusionne JAMAIS deux slots si le slot courant pourrait être un OF différent
      // La seule façon sûre sans of_id : on accepte la fusion SEULEMENT si le slot précédent
      // avait exactement le même depart, qte, format et mac (5 champs identiques = même OF)
      var sameOf=cur&&cur.baseKey===k&&cur.ei===i-1&&
        cur.fr.depart===(r.depart||'')&&
        (cur.fr.qte||'')===(r.qte||'')&&
        (cur.fr.format||'')===(r.format||'')&&
        (cur.fr.mac||'')===(r.mac||'')&&
        (cur.fr.conducteur||'')===(r.conducteur||'');
      if(r.of_id) sameOf=cur&&cur.ofId===r.of_id&&cur.ei===i-1;
      if(sameOf){
        cur.ei=i;cur.rows.push(r);if(r.bold)cur.bold=true;
      } else {
        if(cur)bands.push(cur);
        cur={k:k+'§'+r.date+'§'+(r.half_day||1),baseKey:k,ofId:r.of_id||null,
             si:i,ei:i,rows:[r],fr:r,of_number:r.of_number,client:r.client,
             designation:r.designation,mac:r.mac,qte:r.qte,depart:r.depart,
             conducteur:r.conducteur,bold:r.bold};
      }
    } else {
      if(cur){bands.push(cur);cur=null;}
      if(special) bands.push({special:true,type:r.client,i,date,hd,slot,row:r});
    }
  }
  if(cur)bands.push(cur);
  return bands;
}


// Colonnes réellement utilisées par l'app (évite select=* qui rapatrie tout).
// Repli automatique sur "*" si une colonne n'existe pas encore en base.
var PLANNING_COLS = 'id,date,machine,slot,half_day,of_number,client,designation,mac,qte,format,depart,conducteur,bold';

// ⚠ IMPORTANT : l'API Supabase plafonne chaque réponse (1000 lignes par défaut).
// Sans pagination, dès que la table dépasse ce plafond, les lignes en FIN de tri
// sont silencieusement coupées — et comme le tri sur `date` est textuel, ce sont
// les jours 30 et 31 du mois qui disparaissent en premier (trous fantômes au
// 31/07, 31/08…, erreurs à l'ajout, OF décalés par les recalculs de régime).
// sbAll récupère TOUTES les lignes en paginant. Le chemin DOIT avoir un tri stable.
async function sbAll(pathBase){
  var PAGE=1000, all=[], from=0;
  for(;;){
    var sep=pathBase.indexOf('?')>=0?'&':'?';
    var b=await sb(pathBase+sep+'limit='+PAGE+'&offset='+from);
    all=all.concat(b||[]);
    if(!b||b.length<PAGE) return all;
    from+=PAGE;
  }
}

async function sbPlanning(){
  try{
    return await sbAll('planning?order=date,machine,slot,half_day&select='+PLANNING_COLS);
  }catch(e){
    if(PLANNING_COLS !== '*'){
      console.warn('[PDD] select explicite refusé, repli sur select=* :', e.message);
      PLANNING_COLS = '*';
      return await sbAll('planning?order=date,machine,slot,half_day&select=*');

  }
}

function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x;}
function historyStart(){const d=new Date();d.setDate(d.getDate()-28);return mondayOf(d);}

// Plage de dates affichables : du plus ancien OF (ou 4 semaines avant aujourd'hui)
// jusqu'à +1 an (ou au dernier OF), samedis ouverts inclus.
function computeDates(rowsArr, sc){
  let start=historyStart();
  let ext=new Date(); ext.setFullYear(ext.getFullYear()+1);
  (rowsArr||[]).forEach(r=>{const d=pd(r.date);if(d<start)start=new Date(d);if(d>ext)ext=new Date(d);});
  const all=new Set();
  const cur=new Date(start);
  while(cur<=ext){if(isWD(cur,false))all.add(fd(cur));cur.setDate(cur.getDate()+1);}
  Object.keys(sc||{}).forEach(d=>{if((sc[d]||[]).length>0)all.add(d);});
  return [...all].sort((a,b)=>pd(a)-pd(b));
}

      for(let i=0;i<snapshot.length;i+=200){

        await sb('planning',{method:'POST',body:JSON.stringify(chunk),prefer:'return=minimal'});
      }
      // Les identifiants ont tous changé : l'historique Ctrl+Z n'est plus valable
      histRef.current={undo:[],redo:[]}; idMapRef.current=new Map(); setHistTick(t=>t+1);
      return true;
    }finally{busyRef.current=false;}
  }

  const modalOpenRef=useRef(false);
  useEffect(()=>{modalOpenRef.current=!!modal||!!satModal;},[modal,satModal]);
  const previewDataRef=useRef(null);
  useEffect(()=>{previewDataRef.current=previewData;},[previewData]);

  // ─── HISTORIQUE (Ctrl+Z / Ctrl+Y) ────────────────────────────────────────
  // Chaque action enregistre : lignes supprimées, lignes créées, et les
  // changements annexes (régime, samedi, fermeture, opérateurs).
  // Comme la base attribue de nouveaux identifiants à chaque réinsertion,
  // idMap suit la correspondance ancien id -> id actuel.
  function resolveId(id){const m=idMapRef.current;let g=0;while(m.has(id)&&g<1000){id=m.get(id);g++;}return id;}
  function mapIds(origRows,newRows){
    const byCell=new Map(newRows.map(r=>[cellKey(r),r]));
    origRows.forEach(o=>{
      if(o.id===undefined||o.id===null) return;
      const n=byCell.get(cellKey(o));
      if(n){const from=resolveId(o.id);if(from!==n.id)idMapRef.current.set(from,n.id);}
    });
  }
  function pushHistory(entry){
    const h=histRef.current;
    h.undo=[...h.undo.slice(-(HIST_MAX-1)),entry];
    h.redo=[];
    setHistTick(t=>t+1);
  }

  // Changements annexes : application en base
  async function applyAuxDB(aux,dir){
    const side=(dir==='before'||dir==='undo')?'before':'after';
    for(const a of aux||[]){
      const v=a[side];
      if(a.type==='regime'){
        await sb('machine_regime?machine=eq.'+encodeURIComponent(a.machine)+'&date=eq.'+encodeURIComponent(a.date),{method:'DELETE',prefer:'return=minimal'}).catch(()=>{});
        await sb('machine_regime',{method:'POST',body:JSON.stringify({machine:a.machine,date:a.date,mode:v}),prefer:'return=minimal'});
      } else if(a.type==='sat'){
        await sb('saturday_config?date=eq.'+encodeURIComponent(a.date),{method:'DELETE',prefer:'return=minimal'}).catch(()=>{});
        if(v&&v.length>0) await sb('saturday_config',{method:'POST',body:JSON.stringify({date:a.date,machines:v}),prefer:'return=minimal'});
      } else if(a.type==='closure'){
        await sb('machine_closure?machine=eq.'+encodeURIComponent(a.machine)+'&date=eq.'+encodeURIComponent(a.date),{method:'DELETE',prefer:'return=minimal'}).catch(()=>{});
        if(v) await sb('machine_closure',{method:'POST',body:JSON.stringify({machine:a.machine,date:a.date}),prefer:'return=minimal'});
      } else if(a.type==='op'){
        await Promise.all(a.items.map(it=>sb('operator_assignments?machine=eq.'+encodeURIComponent(it.machine)+'&date=eq.'+encodeURIComponent(it.date)+'&half_day=eq.'+it.half_day,{method:'DELETE',prefer:'return=minimal'}).catch(()=>{})));
        const payload=a.items.filter(it=>it[side]!=null).map(it=>({machine:it.machine,date:it.date,half_day:it.half_day,operator_id:it[side]}));
        if(payload.length) await sb('operator_assignments',{method:'POST',body:JSON.stringify(payload),prefer:'return=minimal'});
      }
    }
  }
  // Changements annexes : application à l'écran (immédiate)
  function applyAuxLocal(aux,dir){
    const side=(dir==='before'||dir==='undo')?'before':'after';
    for(const a of aux||[]){
      const v=a[side];
      if(a.type==='regime'){
        setRegimes(r=>({...r,[a.machine+'|'+a.date]:v}));
      } else if(a.type==='sat'){
        const sc={...satRef.current,[a.date]:v||[]};
        satRef.current=sc;
        setSatConfigs(sc);
        setDates(computeDates(rowsRef.current,sc));
      } else if(a.type==='closure'){
        setClosures(c=>{const n={...c};if(v)n[a.machine+'|'+a.date]=true;else delete n[a.machine+'|'+a.date];return n;});
      } else if(a.type==='op'){
        setOpAssign(o=>{const n={...o};a.items.forEach(it=>{const k=it.machine+'|'+it.date+'|'+it.half_day;if(it[side]==null)delete n[k];else n[k]=it[side];});return n;});
      }
    }
  }

  // Écriture planning : suppression puis insertion, avec remise en place si
  // l'insertion échoue.
  async function dbApply(removeRows,addRows){
    const rmIds=[...new Set(removeRows.map(r=>r.id))];
    if(rmIds.length) await sbDeleteIds(rmIds);
    if(!addRows.length) return [];
    try{
      return await sbInsertRows(addRows.map(stripId));
    }catch(e){
      if(rmIds.length){
        try{const back=await sbInsertRows(removeRows.map(stripId));mapIds(removeRows,back);}catch(e2){}
      }
      throw e;
    }
  }

  // Exécute une action : affichage immédiat, enregistrement en arrière-plan,
  // inscription dans l'historique. En cas d'erreur, rechargement complet.
  async function commit({label,remove=[],add=[],aux=[],toastMsg,light}){
    if(!light&&busyRef.current){showToast('Enregistrement en cours… réessayez dans un instant');return false;}
    if(!light) busyRef.current=true;
    const tmp=add.map(r=>({...stripId(r),id:'tmp_'+(++_tmpSeq)}));
    const rmSet=new Set(remove.map(r=>r.id));
    if(remove.length||tmp.length) setRows(prev=>prev.filter(r=>!rmSet.has(r.id)).concat(tmp));
    if(aux.length) applyAuxLocal(aux,'after');
    try{
      if(aux.length) await applyAuxDB(aux,'after');
      let inserted=[];
      try{
        inserted=await dbApply(remove,add);
      }catch(e){
        if(aux.length){try{await applyAuxDB(aux,'before');}catch(e2){}}
        throw e;
      }
      if(tmp.length||inserted.length){
        const tmpIds=new Set(tmp.map(r=>r.id)); const insIds=new Set(inserted.map(r=>r.id));
        setRows(prev=>prev.filter(r=>!tmpIds.has(r.id)&&!insIds.has(r.id)).concat(inserted));
      }
      pushHistory({label,deleted:remove,inserted,aux});
      if(toastMsg) showToast(toastMsg);
      return true;
    }catch(e){
      showToast('Erreur : '+String(e.message||e).slice(0,120)+' — planning rechargé');
      await load();
      return false;
    }finally{
      if(!light) busyRef.current=false;
      flushRt();
    }
  }

  async function runHistory(dir){
    if(READONLY||previewDataRef.current) return;
    const h=histRef.current;
    const stack=dir==='undo'?h.undo:h.redo;
    if(!stack.length){showToast(dir==='undo'?'Rien à annuler':'Rien à rétablir');return;}
    if(busyRef.current){showToast('Enregistrement en cours… réessayez dans un instant');return;}
    const e=stack[stack.length-1];
    const toRemove=dir==='undo'?e.inserted:e.deleted;
    const toAdd=dir==='undo'?e.deleted:e.inserted;
    // Contrôle : les lignes à retirer sont-elles toujours là, inchangées ?
    const cur=new Map(rowsRef.current.map(r=>[r.id,r]));
    const removeNow=[]; let conflict=false;
    toRemove.forEach(r=>{
      const c=cur.get(resolveId(r.id));
      if(!c||c.machine!==r.machine||c.date!==r.date||(c.half_day||1)!==(r.half_day||1)) conflict=true;
      else removeNow.push(c);
    });
    const rmSet=new Set(removeNow.map(r=>r.id));
    const occ=new Set(rowsRef.current.filter(r=>!rmSet.has(r.id)).map(cellKey));
    toAdd.forEach(r=>{if(occ.has(cellKey(r)))conflict=true;});
    if(conflict){
      stack.pop(); setHistTick(t=>t+1);
      showToast((dir==='undo'?'Annulation':'Rétablissement')+' impossible pour « '+e.label+' » : le planning a été modifié entre-temps (autre poste).');
      return;
    }
    busyRef.current=true;
    const tmp=toAdd.map(r=>({...stripId(r),id:'tmp_'+(++_tmpSeq)}));
    setRows(prev=>prev.filter(r=>!rmSet.has(r.id)).concat(tmp));
    applyAuxLocal(e.aux,dir);
    try{
      await applyAuxDB(e.aux,dir);
      const ins=await dbApply(removeNow,toAdd);
      mapIds(toAdd,ins);
      const tmpIds=new Set(tmp.map(r=>r.id)); const insIds=new Set(ins.map(r=>r.id));
      setRows(prev=>prev.filter(r=>!tmpIds.has(r.id)&&!insIds.has(r.id)).concat(ins));
      stack.pop();
      (dir==='undo'?h.redo:h.undo).push(e);
      setHistTick(t=>t+1);
      showToast(dir==='undo'?'↩ Annulé : '+e.label+' · Ctrl+Y pour rétablir':'↪ Rétabli : '+e.label);
    }catch(err){
      showToast('Erreur : '+String(err.message||err).slice(0,120)+' — planning rechargé');
      await load();
    }finally{
      busyRef.current=false;
      flushRt();
    }
  }
  const undo=()=>runHistory('undo');
  const redo=()=>runHistory('redo');

  // ─── TEMPS RÉEL ──────────────────────────────────────────────────────────
  // Les modifications des autres postes arrivent ligne par ligne et sont
  // appliquées sans recharger le planning. Pendant un enregistrement local,
  // elles sont mises en attente puis appliquées.
  function flushRt(){
    if(busyRef.current) return;
    if(auxPendingRef.current){auxPendingRef.current=false;loadAux();}
    const evs=rtBufRef.current;
    if(!evs.length) return;
    rtBufRef.current=[];
    setRows(prev=>{
      const m=new Map(prev.map(r=>[r.id,r]));
      evs.forEach(ev=>{
        if(ev.eventType==='DELETE'){if(ev.old&&ev.old.id!=null)m.delete(ev.old.id);}
        else if(ev.new&&ev.new.id!=null) m.set(ev.new.id,ev.new);
      });
      return [...m.values()];
    });
  }

  useEffect(()=>{
    load().then(planningRows=>{if(planningRows) createDailyBackup(planningRows);});
    if(!window.supabase||!window.supabase.createClient){setRtStatus('off');return;}
    const client=window.supabase.createClient(SB,KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    let wasLost=false, auxTimer=null;
    const scheduleRows=()=>{clearTimeout(rtTimerRef.current);rtTimerRef.current=setTimeout(()=>H.current.flushRt(),150);};
    let ch=client.channel('pdd-planning')
      .on('postgres_changes',{event:'*',schema:'public',table:'planning'},p=>{rtBufRef.current.push(p);scheduleRows();});
    RT_AUX_TABLES.forEach(t=>{
      ch=ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{
        clearTimeout(auxTimer);
        auxTimer=setTimeout(()=>{auxPendingRef.current=true;H.current.flushRt();},400);
      });
    });
    ch.subscribe(status=>{
      if(status==='SUBSCRIBED'){
        setRtStatus('live');
        if(wasLost){wasLost=false;if(!busyRef.current)H.current.load();}
      } else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        setRtStatus('off'); wasLost=true;
      }
    });
    // Retour sur l'onglet alors que le temps réel est coupé : resynchronisation
    let lastFull=Date.now();
    const onVis=()=>{
      if(document.visibilityState!=='visible') return;
      if(H.current.rtStatus==='live') return;
      if(Date.now()-lastFull<60000||busyRef.current||modalOpenRef.current||previewDataRef.current) return;
      lastFull=Date.now(); H.current.load();
    };
    document.addEventListener('visibilitychange',onVis);
    return()=>{document.removeEventListener('visibilitychange',onVis);client.removeChannel(ch);};
  },[]);

  // Ctrl+Z / Ctrl+Y (ignorés dans les champs de saisie et fenêtres ouvertes)
  useEffect(()=>{
    function onKey(e){
      if(!(e.ctrlKey||e.metaKey)) return;
      const t=e.target, tag=(t&&t.tagName)||'';
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)) return;
      if(modalOpenRef.current) return;
      const k=(e.key||'').toLowerCase();
      if(k==='z'&&!e.shiftKey){e.preventDefault();H.current.undo();}
      else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();H.current.redo();}
    }
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[]);

  // ─── GRILLE ──────────────────────────────────────────────────────────────
  const activeRows=previewData?previewData.rows:rows;
  const activeDates=useMemo(()=>{
    if(!previewData) return dates;
    const extra=new Set(previewData.rows.map(r=>r.date).filter(d=>!dates.includes(d)));
    if(extra.size===0) return dates;
    return [...new Set([...dates,...extra])].sort((a,b)=>pd(a)-pd(b));
  },[dates, previewData]);

  const lkp=useMemo(()=>{
    const m={};
    activeRows.forEach(r=>{m[r.machine+'|'+r.date+'|'+(r.half_day||1)+'|'+r.slot]=r;});
    return m;
  },[activeRows]);

  const subCols=useMemo(()=>buildSubCols(activeDates,sat),[activeDates]);
  const subColsMap=useMemo(()=>{const m=new Map();subCols.forEach((sc,i)=>m.set(sc.date+'|'+sc.hd,i));return m;},[subCols]);

  // Grille d'une machine (samedis non ouverts et jours fermés exclus)
  function machineColsFor(machine,sc,cl){
    sc=sc||satRef.current; cl=cl||closRef.current;
    const all=new Set(datesRef.current);
    Object.keys(sc).forEach(d=>{if((sc[d]||[]).length)all.add(d);});
    const out=[];
    [...all].sort((a,b)=>pd(a)-pd(b)).forEach(d=>{
      if(pd(d).getDay()===6&&!((sc[d]||[]).includes(machine))) return;
      if(cl[machine+'|'+d]) return;
      out.push({date:d,hd:1});out.push({date:d,hd:2});
    });
    return out;
  }

  const histStartDate=historyStart();
  const filteredDates=useMemo(()=>{
    let base=activeDates;
    if(!showHistory&&!q&&!previewData) base=base.filter(d=>pd(d)>=histStartDate);
    if(!q) return base;
    const ql=q.toLowerCase();
    const hit=new Set(activeRows.filter(r=>
      (r.client||'').toLowerCase().includes(ql)||(r.of_number||'').toLowerCase().includes(ql)||(r.designation||'').toLowerCase().includes(ql)
    ).map(r=>r.date));
    return base.filter(d=>hit.has(d));
  },[activeDates,activeRows,q,showHistory,previewData,histStartDate.getTime()]);

  const filteredSubCols=useMemo(()=>buildSubCols(filteredDates,sat),[filteredDates]);

  const bandsPerMachine=useMemo(()=>{
    const res={};
    MACHINES.forEach(machine=>{res[machine]=mkBands(machine,1,filteredSubCols,lkp);});
    return res;
  },[lkp,filteredSubCols]);

  // Défilement initial sur aujourd'hui, et conservation de la position
  // quand on affiche / masque l'historique
  const scrolledRef=useRef(false);
  const today=fd(new Date());
  useLayoutEffect(()=>{
    if(loading||!gridRef.current) return;
    if(!scrolledRef.current){
      const idx=filteredDates.indexOf(today);
      if(idx>=0){gridRef.current.scrollLeft=Math.max(0,LW+(idx*2-5)*hdw-80);scrolledRef.current=true;}
      return;
    }
    if(scrollAnchorRef.current){
      const {date,offset}=scrollAnchorRef.current; scrollAnchorRef.current=null;
      const idx=filteredDates.indexOf(date);
      if(idx>=0) gridRef.current.scrollLeft=idx*2*hdw+offset;
    }
  },[loading,filteredDates]);

  function toggleHistory(){
    if(gridRef.current){
      const sl=gridRef.current.scrollLeft;
      const idx=Math.max(0,Math.floor(sl/(2*hdw)));
      const d=filteredDates[Math.min(idx,filteredDates.length-1)];
      if(d) scrollAnchorRef.current={date:d,offset:sl-idx*2*hdw};
    }
    setShowHistory(v=>!v);
  }

  // ─── GLISSER-DÉPOSER (aucun rendu React pendant le glisser) ───────────────
  function clearDragOver(){
    if(dragOverElRef.current){dragOverElRef.current.classList.remove('dov');dragOverElRef.current=null;}
  }
  function onBandDragStart(e,row){
    dragSrcRef.current=row;
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain','of');}catch(_){}
    const el=e.currentTarget; dragElRef.current=el;
    requestAnimationFrame(()=>{el.style.opacity='.4';});
  }
  function onBandDragEnd(){
    if(dragElRef.current){dragElRef.current.style.opacity='';dragElRef.current=null;}
    clearDragOver();
    dragSrcRef.current=null;
  }
  function onGridDragOver(e){
    if(!dragSrcRef.current) return;
    const el=e.target&&e.target.closest?e.target.closest('[data-m]'):null;
    if(!el) return;
    e.preventDefault();
    if(dragOverElRef.current!==el){clearDragOver();el.classList.add('dov');dragOverElRef.current=el;}
  }
  function subColFromEvent(e){
    if(!gridRef.current) return null;
    const rect=gridRef.current.getBoundingClientRect();
    const x=e.clientX-rect.left+gridRef.current.scrollLeft-LW;
    if(x<0) return null;
    const idx=Math.floor(x/hdw);
    if(idx>=0&&idx<filteredSubCols.length) return filteredSubCols[idx];
    return null;
  }
  async function onGridDrop(e){
    const el=e.target&&e.target.closest?e.target.closest('[data-m]'):null;
    const src=dragSrcRef.current;
    clearDragOver();
    if(!el||!src) return;
    e.preventDefault();
    dragSrcRef.current=null;
    if(isLocked) return;
    const col=subColFromEvent(e);
    if(!col) return;
    const tMachine=el.getAttribute('data-m');
    const res=planDrop({rows:rowsRef.current,src,tMachine,tSlot:1,tDate:col.date,tHD:col.hd,cols:machineColsFor(tMachine),regimes:regRef.current});
    if(res.noop) return;
    if(res.error){showToast(res.error);return;}
    if(res.blocked){showToast(blockedMessage(res.blocked));return;}
    if(res.anchored.length&&!window.confirm(anchoredMessage(res.anchored,'Ce déplacement'))){showToast('Déplacement annulé — OF calé sur réception matière');return;}
    const n=res.pushed.length;
    await commit({label:'Déplacement '+(src.client||src.of_number||''),remove:res.remove,add:res.add,
      toastMsg:'✓ OF déplacé'+(n?' · '+n+' repoussé(s)':'')+' · Ctrl+Z pour annuler'});
  }

  // ─── AJOUT / MODIFICATION / SUPPRESSION ──────────────────────────────────
  async function onSave(formData, halfDayCount, origData, newDurOverride){
    if(modal.type==='add'){
      const sc=satRef.current, cl=closRef.current;
      const openSats=new Set(Object.entries(sc).filter(([d,ms])=>ms.includes(formData.machine)).map(([d])=>d));
      const closedDays=new Set(Object.keys(cl).filter(k=>k.startsWith(formData.machine+'|')).map(k=>k.split('|')[1]));
      const slots=planHalfDays(halfDayCount, formData.date, formData.half_day||1, sets, formData.machine, sat, null, openSats, closedDays);
      const newRows=slots.map(s=>({...stripId(formData),date:s.date,half_day:s.half_day}));
      const res=planAdd({rows:rowsRef.current,newRows,machine:formData.machine,slot:formData.slot,cols:machineColsFor(formData.machine)});
      if(res.blocked){showToast(blockedMessage(res.blocked));return;}
      if(res.anchored.length&&!window.confirm(anchoredMessage(res.anchored,'L’ajout de cet OF'))){showToast('Ajout annulé — OF calé sur réception matière');return;}
      setModal(null);
      const ok=await commit({label:'Ajout '+formData.client,remove:res.remove,add:res.add,
        toastMsg:'✓ OF ajouté — '+slots.length+' demi-journée(s) · Ctrl+Z pour annuler'});
      if(ok&&formData.client&&!clients.includes(formData.client)){
        sb('clients',{method:'POST',body:JSON.stringify({nom:formData.client}),prefer:'return=minimal'}).catch(()=>{});
        setClients(c=>[...c,formData.client].sort());
      }
      return;
    }
    // Modification (+ changement de durée éventuel) = une seule action d'historique
    const orig=origData||formData;
    const patch={of_number:formData.of_number,client:formData.client,designation:formData.designation,
      mac:formData.mac,qte:formData.qte,depart:formData.depart,conducteur:formData.conducteur,
      bold:formData.bold,format:formData.format||''};
    const isSame=sameOfPred(orig);
    const allOfRows=rowsRef.current.filter(r=>r.machine===orig.machine&&r.slot===orig.slot&&isSame(r));
    if(!allOfRows.length){setModal(null);return;}
    const patched=allOfRows.map(r=>({...r,...patch,id:'p_'+r.id}));
    let diff={remove:allOfRows,add:patched.map(stripId)};
    let extraMsg='';
    if(newDurOverride!==undefined&&newDurOverride!==allOfRows.length){
      const pseudo=rowsRef.current.filter(r=>!allOfRows.includes(r)).concat(patched);
      const res=planResize({rows:pseudo,first:patched[0],newLen:newDurOverride,cols:machineColsFor(orig.machine)});
      if(res.error){showToast(res.error);return;}
      if(res.blocked){showToast(blockedMessage(res.blocked));return;}
      if(!res.noop){
        if(res.anchored.length&&!window.confirm(anchoredMessage(res.anchored,'Cette extension'))){showToast('Modification annulée — OF calé sur réception matière');return;}
        diff=composeDiff({remove:allOfRows,add:patched},res);
        if(res.pushed&&res.pushed.length) extraMsg=' · '+res.pushed.length+' OF repoussé(s)';
      }
    }
    setModal(null);
    await commit({label:'Modification '+(formData.client||orig.client),remove:diff.remove,add:diff.add,
      toastMsg:'✓ OF mis à jour'+extraMsg+' · Ctrl+Z pour annuler'});
  }

  async function onDel(id){
    const clicked=rowsRef.current.find(x=>x.id===id);
    if(!clicked) return;
    const isSame=sameOfPred(clicked);
    const toDel=rowsRef.current.filter(r=>r.machine===clicked.machine&&r.slot===clicked.slot&&isSame(r));
    setModal(null);
    await commit({label:'Suppression '+clicked.client,remove:toDel,add:[],toastMsg:'✓ Supprimé · Ctrl+Z pour annuler'});
  }

  async function onShift(machine,of_number,client,designation,slot,halfDays){
    const first=rowsRef.current.find(r=>r.machine===machine&&r.slot===slot&&r.of_number===of_number&&r.client===client&&r.designation===designation);
    if(!first) return;
    const isSame=sameOfPred(first);
    const cols=machineColsFor(machine), map=colIndexMap(cols);
    const ofR=rowsRef.current.filter(r=>r.machine===machine&&r.slot===slot&&isSame(r));
    const add=[];
    ofR.forEach(r=>{const ri=map.get(r.date+'|'+(r.half_day||1));const ni=ri+halfDays;if(ri!==undefined&&ni>=0&&ni<cols.length)add.push(moveRow(r,cols[ni]));});
    if(!add.length) return;
    setModal(null);
    await commit({label:'Décalage '+client,remove:ofR,add,toastMsg:'✓ Décalé · Ctrl+Z pour annuler'});

  async function onResize(first,newLen){
    const res=planResize({rows:rowsRef.current,first,newLen,cols:machineColsFor(first.machine)});
    if(res.noop) return;
    if(res.error){showToast(res.error);return;}
    if(res.blocked){showToast(blockedMessage(res.blocked));return;}
    if(res.anchored.length&&!window.confirm(anchoredMessage(res.anchored,'Cette extension'))){showToast('Extension annulée — OF calé sur réception matière');return;}
    await commit({label:'Durée '+(first.of_number||first.client),remove:res.remove,add:res.add,
      toastMsg:(res.reduced?'✓ OF réduit':'✓ OF étendu'+(res.pushed.length?' · '+res.pushed.length+' OF repoussé(s)':''))+' · Ctrl+Z pour annuler'});
  }

  function onResizeStart(e, band, slot, machine){
    e.stopPropagation(); e.preventDefault();
    const state={band, slot, machine, startX:e.clientX, origDur:band.rows.length, curDur:band.rows.length};
    let cur=state;
    setResizeSrc(state);
    function onMove(ev){
      const newDur=Math.max(1, state.origDur+Math.round((ev.clientX-state.startX)/hdw));
      if(newDur===cur.curDur) return; // ne redessine que si la durée change
      cur={...cur,curDur:newDur};
      setResizeSrc(cur);
    }
    function onUp(){
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
      setResizeSrc(null);
      justResizedRef.current=true;
      setTimeout(()=>{justResizedRef.current=false;},300);
      if(cur.curDur!==cur.origDur) onResize(band.fr,cur.curDur);
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  }

  // ─── SAMEDIS / FERMETURES / RÉGIMES / OPÉRATEURS ─────────────────────────
  async function saveSatConfig(date, machines){
    const sc=satRef.current, cl=closRef.current;
    const prev=sc[date]||[];
    const changed=MACHINES.filter(m=>prev.includes(m)!==machines.includes(m));
    const newSc={...sc,[date]:machines};
    let remove=[],add=[],anchored=[];
    changed.forEach(m=>{
      const r=planResim(rowsRef.current,m,machineColsFor(m,sc,cl),machineColsFor(m,newSc,cl));
      remove=remove.concat(r.remove);add=add.concat(r.add);anchored=anchored.concat(r.anchored);
    });
    if(anchored.length&&!window.confirm(anchoredMessage(anchored,'Cette modification du samedi '+date))){showToast('Modification du samedi annulée');return;}
    setSatModal(null);
    await commit({label:'Samedi '+date,remove,add,aux:[{type:'sat',date,before:prev,after:machines}],
      toastMsg:'✓ Samedi '+date+' mis à jour · Ctrl+Z pour annuler'});
  }

  async function setClosure(machine,date,closed){
    const cl=closRef.current;
    const newCl={...cl};
    if(closed) newCl[machine+'|'+date]=true; else delete newCl[machine+'|'+date];
    const r=planResim(rowsRef.current,machine,machineColsFor(machine,null,cl),machineColsFor(machine,null,newCl));
    if(r.anchored.length&&!window.confirm(anchoredMessage(r.anchored,(closed?'La fermeture':'La réouverture')+' de '+machine+' le '+date))){showToast('Action annulée');return;}
    await commit({label:(closed?'Fermeture ':'Réouverture ')+machine+' '+date,remove:r.remove,add:r.add,
      aux:[{type:'closure',machine,date,before:!closed,after:closed}],
      toastMsg:'✓ '+machine+(closed?' fermée':' rouverte')+' le '+date+' · Ctrl+Z pour annuler'});
  }

    } else keys.push({machine,date,half_day:halfDay});
    const oa=opAssignRef.current;
    const items=keys.map(k=>({...k,before:oa[k.machine+'|'+k.date+'|'+k.half_day]||null,after:operatorId||null}))
      .filter(it=>it.before!==it.after);
    if(!items.length) return;
    const op=operators.find(o=>o.id===operatorId);
    await commit({label:'Opérateur '+(op?op.abrev:'—')+' '+machine+' '+date,aux:[{type:'op',items}],light:true});
  }

// Panneau de choix d'un opérateur (un seul pour toute la grille)
function OpPicker({picker,operators,current,onPick,onClose}){
  const list=operators.filter(o=>!o.archived).sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  const isWeek=pd(picker.date).getDay()===1&&picker.hd===1;
  const left=Math.min(picker.x,window.innerWidth-200);
  const top=Math.min(picker.y,window.innerHeight-Math.min(420,60+list.length*30));
  const item=(sel)=>({display:'flex',alignItems:'center',gap:8,padding:'5px 8px',borderRadius:4,cursor:'pointer',fontSize:12,
    background:sel?'#f5f3ed':'transparent',fontWeight:sel?700:400});
  return(
    <div style={{position:'fixed',inset:0,zIndex:250}} onClick={onClose}>
      <div style={{position:'fixed',left,top,width:190,maxHeight:420,overflowY:'auto',background:'#fff',borderRadius:8,
        border:'1px solid #c9a84c',boxShadow:'0 8px 24px rgba(0,0,0,.25)',padding:6,zIndex:251}}
        onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:10,color:'#8a8880',fontFamily:'IBM Plex Mono,monospace',padding:'2px 6px 6px',borderBottom:'1px solid #eee',marginBottom:4}}>
          {picker.machine} · {picker.date} · {picker.hd===1?'matin':'après-midi'}
          {isWeek&&<div style={{color:'#8a6a20',marginTop:2}}>Lundi matin : toute la semaine</div>}
        </div>
        <div style={item(!current)} onClick={()=>onPick(null)}
          onMouseEnter={e=>e.currentTarget.style.background='#f0efe9'} onMouseLeave={e=>e.currentTarget.style.background=!current?'#f5f3ed':'transparent'}>
          <span style={{width:30,textAlign:'center',color:'#999'}}>—</span> Aucun
        </div>
        {list.map(o=>(
          <div key={o.id} style={item(current===o.id)} onClick={()=>onPick(o.id)}
            onMouseEnter={e=>e.currentTarget.style.background='#f0efe9'} onMouseLeave={e=>e.currentTarget.style.background=current===o.id?'#f5f3ed':'transparent'}>
            <span style={{width:30,textAlign:'center',borderRadius:3,padding:'2px 0',background:o.color,color:textOnColor(o.color),
              fontFamily:'IBM Plex Mono,monospace',fontSize:11,fontWeight:800}}>{o.abrev}</span>
            <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.nom}</span>
          </div>
        ))}
      </div>
    </div>
  );
}


function EditModal({modal,onClose,onSave,onDel,onShift,onResize,rows,subCols,dates,sets,sat,clients,onCloseMachine}){
  const isEdit=modal.type==='edit';
  const [f,setF]=useState({...modal.data});
  const [hdCount,setHdCount]=useState(2); // half-days, default 1j

  // Calculs régime et durée AVANT newDur useState
  const regimeKey=(window._regimes&&window._regimes[modal.data.machine+'|'+modal.data.date]);
  const mode0=regimeKey||'1x8';
  const ofRowsInit=isEdit?(rows||[]).filter(r=>r.machine===modal.data.machine&&r.slot===modal.data.slot&&r.of_number===modal.data.of_number&&r.client===modal.data.client&&r.designation===modal.data.designation):[];
  const curEqInit=ofRowsInit.reduce((sum,r)=>{
    const m=(window._regimes&&window._regimes[r.machine+'|'+r.date])||'1x8';
    return sum+(m==='2x8'?1:0.5);
  },0);
  const eqF0=mode0==='2x8'?1:2;
  // newDur initialisé en demi-j correspondant à curEq dans le mode du premier slot
  const [newDur,setNewDur]=useState(()=>{
    if(!isEdit) return 2;
    return Math.max(1, ofRowsInit.length); // demi-j exact, sans arrondi
  });
  // Color: auto from designation (fallback client), with manual override
  const autoColor=hc((f.designation||f.client||''));
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const [clientSugg,setClientSugg]=useState([]);
  const [showSugg,setShowSugg]=useState(false);
  function onClientChange(val){
    s('client',val);
    if(val.length>=1){
      const q=val.toLowerCase();
      setClientSugg((clients||[]).filter(c=>c.toLowerCase().includes(q)).slice(0,8));
      setShowSugg(true);
    } else {
      setShowSugg(false);
    }
  }
  // Extract existing color override from conducteur field
  const existingColor=(()=>{
    const c=modal.data.conducteur||'';
    if(c.startsWith('COLOR:')){const m=c.match(/^COLOR:(#[0-9a-fA-F]{6})/);if(m)return m[1];}
    return null;
  })();
  const [colorOverride,setColorOverride]=useState(existingColor);
  const [showPalette,setShowPalette]=useState(false);
  const displayColor=colorOverride||autoColor;
  const mode=mode0;
  const hpd=hphd(mode==='2x8'?'2x8':'journee');
  const ofRows=ofRowsInit;
  const curDuration=ofRows.length;
  const curEq=curEqInit;

  // Convert dd/mm/yy to yyyy-mm-dd for input[type=date] and back
  function toInputDate(s){if(!s)return'';const p=s.split('/');if(p.length!==3)return'';return`20${p[2]}-${p[1]}-${p[0]}`;}
  function fromInputDate(s){if(!s)return'';const p=s.split('-');return`${p[2]}/${p[1]}/${p[2]?p[0].slice(2):''}`;}

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100}}>
      <div style={{background:'#fff',borderRadius:10,padding:24,width:500,maxWidth:'95vw',maxHeight:'92vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,.25)'}}><form autoComplete="off" style={{display:'contents'}} onSubmit={async e=>{e.preventDefault();const {_showPalette,...fClean}=f;const savedForm={...fClean,conducteur:encodeColor(colorOverride,getObs(f),getDone(f))};await onSave(savedForm,hdCount,modal.data,(isEdit&&newDur!==curDuration)?newDur:undefined);}}>
        <div style={{fontFamily:'IBM Plex Mono,monospace',fontSize:12,color:'#8a6a20',letterSpacing:1,marginBottom:20,textTransform:'uppercase'}}>
          {isEdit?'✏ Modifier l\'OF':'+ Nouvel OF'}
        </div>

        {/* Info contextuelle (non modifiable en création car définie par le clic) */}
        <div style={{background:'#f5f5f0',borderRadius:6,padding:'8px 12px',marginBottom:14,fontSize:11,color:'#666',display:'flex',gap:16,flexWrap:'wrap'}}>
          <span>🔧 <strong>{f.machine}</strong></span>
          <span>📅 <strong>{f.date}</strong> · {f.half_day===1?'Matin':'PM'}</span>

        </div>

        <div className="frow"><label className="lbl">N° OF</label>
          <input className="inp" value={f.of_number} onChange={e=>s('of_number',e.target.value)} placeholder="2603000001"/>
        </div>

        <div className="frow" style={{position:'relative'}}><label className="lbl">Client</label>
          <input className="inp" value={f.client}
            onChange={e=>onClientChange(e.target.value)}
            onFocus={()=>{if(f.client.length>=1)setShowSugg(true);}}
            onBlur={()=>setTimeout(()=>setShowSugg(false),150)}
            placeholder="PUSTERLA" autoComplete="off"/>
          {showSugg&&clientSugg.length>0&&(
            <div style={{position:'absolute',top:'100%',left:0,right:0,background:'#fff',border:'1px solid #ddd',borderRadius:'0 0 6px 6px',boxShadow:'0 4px 12px rgba(0,0,0,.1)',zIndex:200,maxHeight:200,overflowY:'auto'}}>
              {clientSugg.map(c=>(
                <div key={c} onMouseDown={()=>{s('client',c);setShowSugg(false);}}
                  style={{padding:'8px 12px',cursor:'pointer',fontSize:13,borderBottom:'1px solid #f0efe9'}}
                  onMouseEnter={e=>e.currentTarget.style.background='#f5f3ed'}
                  onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
                  {c}
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="frow"><label className="lbl">Désignation</label>
          <input className="inp" value={f.designation} onChange={e=>s('designation',e.target.value)}/>

          </div>

            <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,zIndex:300,background:'#fff',
              border:'1px solid #ccc',borderRadius:4,padding:8,boxShadow:'0 4px 16px rgba(0,0,0,.2)'}}>
              <div style={{display:'grid',gridTemplateColumns:'repeat(10,20px)',gap:2}}>
                {[
                  '#000000','#434343','#666666','#999999','#b7b7b7','#cccccc','#d9d9d9','#efefef','#f3f3f3','#ffffff',
                  '#ff0000','#ff9900','#ffff00','#00ff00','#00ffff','#4a86e8','#0000ff','#9900ff','#ff00ff','#ff4081',
                  '#e06666','#f6b26b','#ffd966','#93c47d','#76d7ea','#6fa8dc','#8e7cc3','#c27ba0','#e66100','#bf9000',

        </div>
        <div className="frow">
          <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13}}>
            <input type="checkbox" checked={getDone(f)} onChange={e=>s('conducteur',encodeColor(colorOverride,getObs(f),e.target.checked))} style={{width:16,height:16,accentColor:'#888'}}/>

          </label>
        </div>

        {isEdit&&(
          <div style={{background:'#f5f3ed',borderRadius:7,padding:'12px 14px',border:'1px solid #e0ddd5',marginTop:4,marginBottom:2}}>
            {(()=>{
              const eqF=mode==='2x8'?1:2;
              const presets=mode==='2x8'?[1,2,3,4,5,6]:[0.5,1,1.5,2,2.5,3];
              return(<>
                <div style={{fontSize:10,color:'#8a8880',textTransform:'uppercase',letterSpacing:1,marginBottom:8,fontFamily:'IBM Plex Mono,monospace'}}>

                  {presets.map(v=>(
                    <button key={v} type="button" onClick={()=>setNewDur(v*eqF)} style={{
                      padding:'6px 10px',borderRadius:5,border:'2px solid',
                      borderColor:newDur===v*eqF?'#8a6a20':'#ddd',
                      background:newDur===v*eqF?'#8a6a20':'#fff',

                  ))}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <button type="button" onClick={()=>setNewDur(d=>Math.max(eqF*(mode==='2x8'?1:0.5), d-eqF*(mode==='2x8'?1:0.5)))}
                    style={{width:32,height:32,borderRadius:5,border:'2px solid #ddd',background:'#fff',
                      fontSize:18,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
                  <input type="number" min={mode==='2x8'?1:0.5} step={mode==='2x8'?1:0.5} value={newDur/eqF}
                    onChange={e=>setNewDur(Math.max(mode==='2x8'?1:0.5,parseFloat(e.target.value)||0.5)*eqF)}

                      background:'#fff',fontSize:14,fontFamily:'IBM Plex Mono,monospace',fontWeight:700,textAlign:'center'}}/>
                  <span style={{fontSize:13,color:'#888',fontWeight:600}}>éq</span>
                  <button type="button" onClick={()=>setNewDur(d=>d+eqF*(mode==='2x8'?1:0.5))}
                    style={{width:32,height:32,borderRadius:5,border:'2px solid #ddd',background:'#fff',
                      fontSize:18,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
                </div>
              </>);
            })()}
          </div>
        )}

        <div style={{display:'flex',gap:8,marginTop:20,justifyContent:'flex-end'}}>
          {isEdit&&<button type="button" className="btn btn-danger" onClick={()=>{if(confirm('Supprimer cet OF ?'))onDel(f.id)}}>Supprimer</button>}
          {!isEdit&&onCloseMachine&&(
            <button type="button" onClick={()=>{
              if(confirm('Fermer la machine '+f.machine+' le '+f.date+' ?')){
                onCloseMachine(f.machine,f.date);
                onClose();
              }
            }} style={{
              padding:'6px 13px',borderRadius:5,border:'1px solid #888',
              background:'#f5f0e8',color:'#5a3e00',fontSize:12,fontWeight:600,
              cursor:'pointer',fontFamily:'IBM Plex Sans,sans-serif',
            }}>🔒 Fermer la machine ce jour</button>
          )}
          <button type="button" className="btn" onClick={onClose}>Annuler</button>
          <button type="submit" className="btn btn-primary">{isEdit?'Enregistrer':'Ajouter'}</button>
        </div>
      </form></div>
    </div>
  );
}


function SaturdayModal({date, machines, onClose, onSave}){
  const d=pd(date);

    d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2);
  const [sel,setSel]=React.useState([...machines]);

  function toggle(m){
    setSel(s=>s.includes(m)?s.filter(x=>x!==m):[...s,m]);
  }

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',
      alignItems:'center',justifyContent:'center',zIndex:120}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>

        boxShadow:'0 20px 60px rgba(0,0,0,.25)'}}>

        <div style={{fontSize:12,color:'#666',marginBottom:16}}>
          Cochez les machines ouvertes ce samedi :
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:20}}>
          {MACHINES.map(m=>(
            <label key={m} style={{display:'flex',alignItems:'center',gap:10,
              padding:'8px 12px',borderRadius:6,cursor:'pointer',
              background:sel.includes(m)?'#d4eaff':'#f5f5f0',
              border:sel.includes(m)?'1px solid #90c4f0':'1px solid #e0e0d8',
              transition:'all .15s'}}>
              <input type="checkbox" checked={sel.includes(m)} onChange={()=>toggle(m)}

          <button className="btn" onClick={onClose}>Annuler</button>

        </div>

    </div>
  );
}
