function ClientsManager({onClose}){
  const [list,setList]=useState([]);
  const [search,setSearch]=useState('');
  const [newName,setNewName]=useState('');
  const [loading,setLoading]=useState(true);
  const [msg,setMsg]=useState('');

  async function load(){
    setLoading(true);
    const data=await sb('clients?order=nom&select=*');
    setList(data||[]);
    setLoading(false);
  }
  useEffect(()=>{load();},[]);

  async function add(){
    const n=newName.trim();
    if(!n) return;
    try{
      await sb('clients',{method:'POST',body:JSON.stringify({nom:n}),prefer:'return=minimal'});
      setNewName('');setMsg('✓ Ajouté');setTimeout(()=>setMsg(''),2000);load();
    }catch(e){setMsg('Erreur: '+e.message);}
  }

  async function del(id,nom){
    if(!confirm('Supprimer "'+nom+'" de la liste ?')) return;
    try{
      await sb('clients?id=eq.'+id,{method:'DELETE',prefer:'return=minimal'});
      setMsg('✓ Supprimé');setTimeout(()=>setMsg(''),2000);load();
    }catch(e){setMsg('Erreur: '+e.message);}
  }

  const filtered=list.filter(c=>c.nom.toLowerCase().includes(search.toLowerCase()));

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'flex-start',justifyContent:'flex-end',zIndex:110}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:'#fff',width:420,height:'100vh',overflowY:'auto',boxShadow:'-10px 0 40px rgba(0,0,0,.2)',padding:28,display:'flex',flexDirection:'column'}}>
        <div style={{fontFamily:'IBM Plex Mono,monospace',fontSize:13,color:'#8a6a20',letterSpacing:1,marginBottom:20,textTransform:'uppercase'}}>
          👥 Gestion des clients
        </div>

        {/* Add new */}
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          <input className="inp" placeholder="Nouveau client…" value={newName}
            onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&add()}
            style={{flex:1}}/>
          <button className="btn btn-primary" onClick={add}>Ajouter</button>
        </div>
        {msg&&<div style={{fontSize:12,color:msg.startsWith('✓')?'#2d6a4f':'#c00',marginBottom:10}}>{msg}</div>}

        {/* Search */}
        <input className="inp" placeholder="🔍 Rechercher…" value={search}
          onChange={e=>setSearch(e.target.value)}
          style={{marginBottom:12}}/>

        <div style={{fontSize:11,color:'#aaa',marginBottom:8}}>{filtered.length} client{filtered.length>1?'s':''}</div>

        {/* List */}
        <div style={{flex:1,overflowY:'auto'}}>
          {loading ? <div style={{color:'#aaa',fontSize:13}}>Chargement…</div> :
            filtered.map(c=>(
              <div key={c.id} style={{display:'flex',alignItems:'center',padding:'7px 10px',borderRadius:5,marginBottom:3,background:'#f9f9f7',border:'1px solid #eeede8'}}>
                <span style={{flex:1,fontSize:13}}>{c.nom}</span>
                <button onClick={()=>del(c.id,c.nom)}
                  style={{padding:'2px 8px',borderRadius:4,border:'1px solid #fcc',background:'#fff5f5',color:'#c00',fontSize:11,cursor:'pointer'}}>
                  ✕
                </button>
              </div>
            ))
          }
        </div>

        <button className="btn" style={{marginTop:16}} onClick={onClose}>Fermer</button>
      </div>
    </div>
  );
}

function OperatorsManager({onClose}){
  const [list,setList]=useState([]);
  const [loading,setLoading]=useState(true);
  const [msg,setMsg]=useState('');
  // Form state
  const [newNom,setNewNom]=useState('');
  const [newAbrev,setNewAbrev]=useState('');
  const [newColor,setNewColor]=useState(OP_PALETTE[0]);
  // Edit state : { id, nom, abrev, color }
  const [edit,setEdit]=useState(null);

  async function load(){
    setLoading(true);
    const data=await sb('operators?order=nom&select=*');
    setList(data||[]);
    setLoading(false);
  }
  useEffect(()=>{load();},[]);

  async function add(){
    const nom=newNom.trim();
    const abrev=newAbrev.trim().toUpperCase().slice(0,2);
    if(!nom||!abrev){setMsg('Nom et abrév. requis');setTimeout(()=>setMsg(''),2500);return;}
    if(nom.length>30){setMsg('Nom ≤ 30 caractères');setTimeout(()=>setMsg(''),2500);return;}
    try{
      await sb('operators',{method:'POST',body:JSON.stringify({nom,abrev,color:newColor,archived:false}),prefer:'return=minimal'});
      setNewNom('');setNewAbrev('');setNewColor(OP_PALETTE[0]);
      setMsg('✓ Ajouté');setTimeout(()=>setMsg(''),2000);load();
    }catch(e){setMsg('Erreur: '+e.message);setTimeout(()=>setMsg(''),3500);}
  }

  async function saveEdit(){
    if(!edit) return;
    const nom=edit.nom.trim();
    const abrev=edit.abrev.trim().toUpperCase().slice(0,2);
    if(!nom||!abrev){setMsg('Nom et abrév. requis');setTimeout(()=>setMsg(''),2500);return;}
    if(nom.length>30){setMsg('Nom ≤ 30 caractères');setTimeout(()=>setMsg(''),2500);return;}
    try{
      await sb('operators?id=eq.'+edit.id,{method:'PATCH',body:JSON.stringify({nom,abrev,color:edit.color}),prefer:'return=minimal'});
      setEdit(null);setMsg('✓ Modifié');setTimeout(()=>setMsg(''),2000);load();
    }catch(e){setMsg('Erreur: '+e.message);setTimeout(()=>setMsg(''),3500);}
  }

  async function toggleArchive(o){
    const next=!o.archived;
    const verb=next?'Archiver':'Désarchiver';
    if(!confirm(verb+' "'+o.nom+'" ? '+(next?'Les affectations historiques restent conservées.':'Il redeviendra disponible dans les listes déroulantes.'))) return;
    try{
      await sb('operators?id=eq.'+o.id,{method:'PATCH',body:JSON.stringify({archived:next}),prefer:'return=minimal'});
      setMsg('✓ '+(next?'Archivé':'Désarchivé'));setTimeout(()=>setMsg(''),2000);load();
    }catch(e){setMsg('Erreur: '+e.message);setTimeout(()=>setMsg(''),3500);}
  }

  // Sort: non-archivés d'abord (alphabétique), puis archivés
  const sorted=[...list].sort((a,b)=>{
    if(!!a.archived!==!!b.archived) return a.archived?1:-1;
    return (a.nom||'').localeCompare(b.nom||'');
  });

  function ColorPalette({value,onChange}){
    return(
      <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
        {OP_PALETTE.map(c=>(
          <button key={c} type="button" onClick={()=>onChange(c)}
            style={{
              width:26,height:26,borderRadius:5,cursor:'pointer',
              background:c,
              border:value===c?'2px solid #1a1916':'1px solid rgba(0,0,0,.15)',
              boxShadow:value===c?'0 0 0 2px #c9a84c':'none',
              padding:0,
            }}
            title={c}
          />
        ))}
      </div>
    );
  }

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'flex-start',justifyContent:'flex-end',zIndex:110}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:'#fff',width:520,height:'100vh',overflowY:'auto',boxShadow:'-10px 0 40px rgba(0,0,0,.2)',padding:28,display:'flex',flexDirection:'column'}}>
        <div style={{fontFamily:'IBM Plex Mono,monospace',fontSize:13,color:'#8a6a20',letterSpacing:1,marginBottom:20,textTransform:'uppercase'}}>
          🧑‍🏭 Gestion des personnes
        </div>

        {/* Add new */}
        <div style={{border:'1px solid #eeede8',borderRadius:6,padding:14,marginBottom:16,background:'#fafaf7'}}>
          <div style={{fontSize:11,fontWeight:600,color:'#666',marginBottom:8,letterSpacing:.5,textTransform:'uppercase'}}>Nouvelle personne</div>
          <div style={{display:'flex',gap:8,marginBottom:8}}>
            <input className="inp" placeholder="Nom (30 car. max)" value={newNom} maxLength={30}
              onChange={e=>setNewNom(e.target.value)} style={{flex:1}}/>
            <input className="inp" placeholder="AB" value={newAbrev} maxLength={2}
              onChange={e=>setNewAbrev(e.target.value.toUpperCase())} style={{width:60,textAlign:'center',fontFamily:'IBM Plex Mono,monospace',fontWeight:700}}/>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
            <div style={{fontSize:11,color:'#666'}}>Couleur :</div>
            <ColorPalette value={newColor} onChange={setNewColor}/>
          </div>
          {/* Preview */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
            <div style={{fontSize:11,color:'#888'}}>Aperçu :</div>
            <div style={{
              display:'inline-flex',alignItems:'center',justifyContent:'center',
              minWidth:36,height:24,padding:'0 8px',borderRadius:4,
              background:newColor,color:textOnColor(newColor),
              fontFamily:'IBM Plex Mono,monospace',fontSize:11,fontWeight:800,letterSpacing:.3,
            }}>{newAbrev||'??'}</div>
          </div>
          <button className="btn btn-primary" onClick={add}>Ajouter</button>
        </div>
        {msg&&<div style={{fontSize:12,color:msg.startsWith('✓')?'#2d6a4f':'#c00',marginBottom:10}}>{msg}</div>}

        <div style={{fontSize:11,color:'#aaa',marginBottom:8}}>
          {sorted.filter(o=>!o.archived).length} active{sorted.filter(o=>!o.archived).length>1?'s':''}
          {sorted.filter(o=>o.archived).length>0&&' · '+sorted.filter(o=>o.archived).length+' archivée'+(sorted.filter(o=>o.archived).length>1?'s':'')}
        </div>

        {/* Header cols */}
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'5px 10px',fontSize:10,color:'#999',fontFamily:'IBM Plex Mono,monospace',letterSpacing:.5,textTransform:'uppercase'}}>
          <span style={{flex:1}}>Nom</span>
          <span style={{width:60,textAlign:'center'}}>Abrév.</span>
          <span style={{width:120,textAlign:'center'}}>Couleur</span>
          <span style={{width:80}}></span>
        </div>

        {/* List */}
        <div style={{flex:1,overflowY:'auto'}}>
          {loading ? <div style={{color:'#aaa',fontSize:13}}>Chargement…</div> :
            sorted.map(o=>{
              const isEdit=edit&&edit.id===o.id;
              if(isEdit){
                return(
                  <div key={o.id} style={{padding:12,borderRadius:5,marginBottom:4,background:'#fff8e0',border:'1px solid #c9a84c'}}>
                    <div style={{display:'flex',gap:8,marginBottom:8}}>
                      <input className="inp" value={edit.nom} maxLength={30}
                        onChange={e=>setEdit({...edit,nom:e.target.value})} style={{flex:1}}/>
                      <input className="inp" value={edit.abrev} maxLength={2}
                        onChange={e=>setEdit({...edit,abrev:e.target.value.toUpperCase()})}
                        style={{width:60,textAlign:'center',fontFamily:'IBM Plex Mono,monospace',fontWeight:700}}/>
                    </div>
                    <div style={{marginBottom:10}}>
                      <ColorPalette value={edit.color} onChange={c=>setEdit({...edit,color:c})}/>
                    </div>
                    <div style={{display:'flex',gap:8}}>
                      <button className="btn btn-primary" onClick={saveEdit}>Enregistrer</button>
                      <button className="btn" onClick={()=>setEdit(null)}>Annuler</button>
                    </div>
                  </div>
                );
              }
              return(
                <div key={o.id} style={{
                  display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:5,marginBottom:3,
                  background:o.archived?'#f4f4f0':'#f9f9f7',
                  border:'1px solid '+(o.archived?'#e8e8e0':'#eeede8'),
                  opacity:o.archived?.6:1,
                }}>
                  <span style={{flex:1,fontSize:13,textDecoration:o.archived?'line-through':'none'}}>{o.nom}</span>
                  <span style={{
                    width:60,textAlign:'center',
                    fontFamily:'IBM Plex Mono,monospace',fontSize:12,fontWeight:800,letterSpacing:.3,
                    padding:'3px 0',borderRadius:4,
                    background:o.color,color:textOnColor(o.color||'#ccc'),
                  }}>{o.abrev}</span>
                  <span style={{
                    width:120,textAlign:'center',fontSize:10,color:'#888',fontFamily:'IBM Plex Mono,monospace',
                  }}>{o.color}</span>
                  <span style={{display:'flex',gap:4,width:80,justifyContent:'flex-end'}}>
                    <button onClick={()=>setEdit({id:o.id,nom:o.nom,abrev:o.abrev,color:o.color})}
                      style={{padding:'2px 7px',borderRadius:4,border:'1px solid #dcd',background:'#fff',color:'#555',fontSize:11,cursor:'pointer'}}
                      title="Modifier">✎</button>
                    <button onClick={()=>toggleArchive(o)}
                      style={{padding:'2px 7px',borderRadius:4,border:'1px solid #ddc',background:'#fffbf0',color:'#8a6a20',fontSize:11,cursor:'pointer'}}
                      title={o.archived?'Désarchiver':'Archiver'}>{o.archived?'↺':'📦'}</button>
                  </span>
                </div>
              );
            })
          }
        </div>

        <button className="btn" style={{marginTop:16}} onClick={onClose}>Fermer</button>
      </div>
    </div>
  );
}

// ─── BACKUP MODAL ─────────────────────────────────────────────────────────────
function BackupModal({onClose, loadBackups, restoreBackup, showToast, reload, onPreview, createManualBackup}){
  const [backups,setBackups]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);   // sauvegarde manuelle en cours
  const [restoring,setRestoring]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const [previewing,setPreviewing]=useState(null);

  function refresh(){
    setLoading(true);
    loadBackups().then(d=>{setBackups(d);setLoading(false);});
  }

  useEffect(()=>{ refresh(); },[]);

  async function doManualSave(){
    setSaving(true);
    try{
      await createManualBackup();
      showToast('✓ Sauvegarde manuelle créée');
      refresh();
    }catch(e){
      showToast('Erreur sauvegarde : '+e.message);
    }finally{
      setSaving(false);
    }
  }

  async function doRestore(id,dateLabel){
    setRestoring(id);
    try{
      await restoreBackup(id);
      showToast('✓ Planning restauré — '+dateLabel);
      reload();
      onClose();
    }catch(e){
      showToast('Erreur restauration : '+e.message);
    }finally{
      setRestoring(null);
      setConfirm(null);
    }
  }

  // Détecte si une sauvegarde est manuelle (backup_date préfixé "M|")
  function isManual(b){ return b.backup_date&&b.backup_date.startsWith('M|'); }

  // Format backup_date → lisible
  // Auto : dd/mm/yy → "12 mai 2026"
  // Manuel : "M|dd/mm/yy|HH:MM" → "12 mai 2026 · HH:MM (manuel)"
  function fmt(backup_date){
    if(!backup_date) return backup_date;
    if(backup_date.startsWith('M|')){
      const parts=backup_date.split('|'); // ["M","dd/mm/yy","HH:MM"]
      return fmtDate(parts[1])+(parts[2]?' · '+parts[2]:'')+' ✏';
    }
    return fmtDate(backup_date);
  }
  function fmtDate(s){
    if(!s) return s;
    const p=s.split('/');
    if(p.length!==3) return s;
    const months=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
    return p[0]+' '+months[parseInt(p[1],10)-1]+' 20'+p[2];
  }

  // Pour la vérification "aujourd'hui", on extrait la date réelle
  function getRealDate(b){
    if(isManual(b)) return b.backup_date.split('|')[1];
    return b.backup_date;
  }

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'flex-start',justifyContent:'flex-end',zIndex:110}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:'#fff',width:480,height:'100vh',overflowY:'auto',boxShadow:'-10px 0 40px rgba(0,0,0,.2)',padding:28,display:'flex',flexDirection:'column'}}>

        {/* Titre + bouton sauvegarde manuelle */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
          <div style={{fontFamily:'IBM Plex Mono,monospace',fontSize:13,color:'#8a6a20',letterSpacing:1,textTransform:'uppercase'}}>
            💾 Sauvegardes
          </div>
          <button
            onClick={doManualSave}
            disabled={saving}
            style={{
              display:'flex',alignItems:'center',gap:6,
              padding:'7px 14px',borderRadius:6,
              border:'1px solid #3d85c8',background:'#e8f0fe',
              color:'#1a5cb5',fontSize:12,fontWeight:700,
              cursor:saving?'wait':'pointer',
              fontFamily:'IBM Plex Sans,sans-serif',
            }}>
            {saving
              ?<><div style={{width:11,height:11,borderRadius:'50%',border:'2px solid #aaa',borderTopColor:'#3d85c8',animation:'spin .7s linear infinite'}}/>Sauvegarde…</>
              :<>📸 Sauvegarder maintenant</>}
          </button>
        </div>

        <div style={{fontSize:12,color:'#888',marginBottom:20,lineHeight:1.5}}>
          Un snapshot automatique est créé <strong>chaque jour</strong> à la première ouverture.<br/>
          Vous pouvez aussi créer une sauvegarde <strong>manuelle</strong> à tout moment. Les 60 derniers snapshots sont conservés.
        </div>

        {/* Confirmation overlay */}
        {confirm&&(
          <div style={{background:'#fff8e0',border:'1px solid #c9a84c',borderRadius:8,padding:16,marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:10,color:'#5a3e00'}}>
              ⚠️ Confirmer la restauration — {fmt(confirm.date)} ?
            </div>
            <div style={{fontSize:12,color:'#666',marginBottom:14}}>
              Le planning actuel sera <strong>remplacé</strong> par cette sauvegarde. Cette action est irréversible (sauf si une sauvegarde d'aujourd'hui existe déjà).
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-danger"
                disabled={restoring!==null}
                onClick={()=>doRestore(confirm.id,fmt(confirm.date))}
                style={{minWidth:120}}>
                {restoring===confirm.id?'Restauration…':'Oui, restaurer'}
              </button>
              <button className="btn" onClick={()=>setConfirm(null)}>Annuler</button>
            </div>
          </div>
        )}

        {loading?(
          <div style={{color:'#aaa',fontSize:13,display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:14,height:14,borderRadius:'50%',border:'2px solid #eee',borderTopColor:'#c9a84c',animation:'spin .7s linear infinite'}}/>
            Chargement…
          </div>
        ):backups.length===0?(
          <div style={{color:'#aaa',fontSize:13,padding:'20px 0',textAlign:'center'}}>
            Aucune sauvegarde disponible.<br/>
            <span style={{fontSize:11,color:'#ccc'}}>Cliquez sur "Sauvegarder maintenant" pour créer la première.</span>
          </div>
        ):(
          <div style={{flex:1,overflowY:'auto'}}>
            {backups.map((b,i)=>{
              const realDate=getRealDate(b);
              const isToday=realDate===fd(new Date());
              const manual=isManual(b);
              return(
                <div key={b.id} style={{
                  display:'flex',alignItems:'center',gap:10,
                  padding:'10px 12px',borderRadius:6,marginBottom:4,
                  background:isToday?(manual?'#e8f0fe':'#f0f8e8'):'#f9f9f7',
                  border:'1px solid '+(isToday?(manual?'#3d85c8':'#8aaa60'):'#eeede8'),
                }}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:'#1a1916',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                      {fmtDate(realDate)}
                      {manual&&<span style={{fontSize:10,background:'#3d85c8',color:'#fff',padding:'1px 6px',borderRadius:10}}>manuel</span>}
                      {isToday&&!manual&&<span style={{fontSize:10,background:'#8aaa60',color:'#fff',padding:'1px 6px',borderRadius:10}}>aujourd'hui</span>}
                      {isToday&&manual&&<span style={{fontSize:10,background:'#2a6abf',color:'#fff',padding:'1px 6px',borderRadius:10}}>aujourd'hui</span>}
                      {i===0&&!isToday&&<span style={{fontSize:10,background:'#c9a84c',color:'#fff',padding:'1px 6px',borderRadius:10}}>plus récente</span>}
                    </div>
                    <div style={{fontSize:10,color:'#aaa',marginTop:2,fontFamily:'IBM Plex Mono,monospace'}}>
                      {manual
                        ? b.backup_date.split('|')[2]||''  // HH:MM extrait du label
                        : b.created_at ? new Date(b.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : ''
                      }
                    </div>
                  </div>
                  <div style={{display:'flex',gap:6,flexShrink:0}}>
                    {/* Aperçu */}
                    <button
                      disabled={restoring!==null||previewing!==null}
                      onClick={async()=>{
                        setPreviewing(b.id);
                        try{ await onPreview(b.id, fmt(b.backup_date)); }
                        finally{ setPreviewing(null); }
                      }}
                      title="Visualiser ce snapshot dans le planning"
                      style={{
                        padding:'5px 10px',borderRadius:5,fontSize:11,fontWeight:600,cursor:'pointer',
                        border:'1px solid #3d85c8',background:'#e8f0fe',color:'#1a5cb5',
                        opacity:(restoring||previewing)&&previewing!==b.id?.5:1,
                        fontFamily:'IBM Plex Sans,sans-serif',
                        display:'flex',alignItems:'center',gap:4,
                      }}>
                      {previewing===b.id
                        ?<><div style={{width:10,height:10,borderRadius:'50%',border:'2px solid #aaa',borderTopColor:'#3d85c8',animation:'spin .7s linear infinite'}}/>…</>
                        :<>👁 Aperçu</>}
                    </button>
                    {/* Restaurer */}
                    <button
                      disabled={restoring!==null||previewing!==null}
                      onClick={()=>setConfirm({id:b.id,date:b.backup_date})}
                      title="Restaurer ce snapshot"
                      style={{
                        padding:'5px 10px',borderRadius:5,fontSize:11,fontWeight:600,cursor:'pointer',
                        border:'1px solid #c9a84c',background:'#fffbf0',color:'#8a6a20',
                        opacity:restoring&&restoring!==b.id?.5:1,
                        fontFamily:'IBM Plex Sans,sans-serif',
                      }}>
                      ↩ Restaurer
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div style={{marginTop:16,fontSize:11,color:'#bbb',borderTop:'1px solid #f0efe9',paddingTop:12,lineHeight:1.7}}>
          💡 <strong style={{color:'#888'}}>📸 Sauvegarder maintenant</strong> : snapshot immédiat, disponible dans la liste.<br/>
          <strong style={{color:'#888'}}>👁 Aperçu</strong> : visualise le snapshot dans le planning avant de décider.<br/>
          <strong style={{color:'#888'}}>↩ Restaurer</strong> : remplace le planning actuel après confirmation.
        </div>
        <button className="btn" style={{marginTop:12}} onClick={onClose}>Fermer</button>
      </div>
    </div>
  );
}
// ─── END BACKUP MODAL ─────────────────────────────────────────────────────────

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
